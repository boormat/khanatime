# Preview from main with app_version=dev-<sha>.
#
# Before any tagged /vX.Y.Z/ exists: also refresh site root so the existing
# demo URL https://boormat.github.io/khanatime/ keeps working (same build).
# After a stable release exists: only update /main/ (+ /main/<sha>/ redirect);
# leave root + /v* alone (root stays "latest stable").
name: preview

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  preview:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: swatinem/rust-cache@v2
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: jetli/trunk-action@v0.5.1
        with:
          version: "v0.21.14"

      - name: Short SHA
        run: echo "SHA=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_ENV"

      - name: Check
        run: ./scripts/check.sh
        env:
          KHANATIME_APP_VERSION: dev-${{ env.SHA }}

      - name: Assemble site from gh-pages (preserve /v*)
        run: |
          set -euo pipefail
          mkdir -p site
          git fetch origin gh-pages:gh-pages 2>/dev/null || true
          if git rev-parse --verify gh-pages >/dev/null 2>&1; then
            git archive gh-pages | tar -x -C site
          fi
          # Detect prior stable slots
          if compgen -G 'site/v*' > /dev/null; then
            echo "UPDATE_ROOT=false" >> "$GITHUB_ENV"
            echo "Stable /v* present — preview will not overwrite site root"
          else
            echo "UPDATE_ROOT=true" >> "$GITHUB_ENV"
            echo "No /v* yet — preview will refresh site root (demo URL)"
          fi

      - name: Build preview at /khanatime/main/
        run: |
          set -euo pipefail
          export KHANATIME_APP_VERSION="dev-${SHA}"
          trunk build --release --public-url /khanatime/main/
          rm -rf site/main
          mkdir -p site/main
          cp -a dist/. site/main/

      - name: Build preview at site root (demo URL) when no stables
        if: env.UPDATE_ROOT == 'true'
        run: |
          set -euo pipefail
          export KHANATIME_APP_VERSION="dev-${SHA}"
          # Fresh build — public-url is baked into the wasm/html.
          trunk build --release --public-url /khanatime/
          # Replace root app files but keep site/main and any other dirs.
          find site -mindepth 1 -maxdepth 1 ! -name 'main' ! -name 'v*' ! -name 'releases.json' -exec rm -rf {} +
          cp -a dist/. site/

      - name: SHA bookmark redirect /main/<sha>/ → /main/
        run: |
          set -euo pipefail
          mkdir -p "site/main/${SHA}"
          cat > "site/main/${SHA}/index.html" <<EOF
          <!DOCTYPE html>
          <meta charset="utf-8">
          <title>Khanatime preview ${SHA}</title>
          <meta http-equiv="refresh" content="0; url=/khanatime/main/">
          <link rel="canonical" href="/khanatime/main/">
          <p>Preview <code>dev-${SHA}</code> — <a href="/khanatime/main/">continue</a>.</p>
          EOF

      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Persist tree on gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          force_orphan: false
          keep_files: false
