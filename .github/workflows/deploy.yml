# Retired: main no longer overwrites the floating Pages root on every push.
# Use:
#   - release.yml  — tag vX.Y.Z → immutable /khanatime/vX.Y.Z/ + latest
#   - preview.yml  — main → /khanatime/main/ (dev-<sha>)
# See docs/plan/release-ci.md.
name: deploy

on:
  workflow_dispatch:
    inputs:
      reason:
        description: "Prefer release.yml / preview.yml; only use this for emergencies"
        required: false
        default: "emergency"

permissions:
  contents: read

jobs:
  notice:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "deploy.yml no longer publishes from main."
          echo "Tag a release (release.yml) or use preview.yml for /main/."
          echo "Reason: ${{ inputs.reason }}"
