[package]
name = "khanatime"
version = "0.1.0"
edition = "2021"
authors = ["Mathew Boorman <mathew.boorman@gmail.com>"]
license = "AGPL-3.0"


[dependencies]
sycamore = "0.9"
pulldown-cmark = "0.13"
wasm-bindgen = "0.2"
js-sys = "0.3"
qrcode = { version = "0.14", default-features = false }
miniz_oxide = "0.8"
base64 = "0.22"
web-sys = { version = "0.3", features = [
    "Window",
    "Storage",
    "HtmlInputElement",
    "HtmlSelectElement",
    "KeyboardEvent",
    "InputEvent",
    "MouseEvent",
    "Element",
    "Event",
    "console",
    "BroadcastChannel",
    "MessageEvent",
    "Location",
    "History",
    "Navigator",
    "Clipboard",
    "MediaDevices",
    "MediaStream",
    "MediaStreamConstraints",
    "MediaStreamTrack",
    "HtmlVideoElement",
] }
wasm-bindgen-futures = "0.4"

# getrandom needs its wasm JS backend on wasm32-unknown-unknown
getrandom03 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }
getrandom04 = { package = "getrandom", version = "0.4", features = ["wasm_js"] }

# Ed25519 signing — already transitive via vodozemac, promoted to direct.
ed25519-dalek = { version = "2.2", features = ["rand_core", "alloc", "std"] }
rand_core = { version = "0.6", features = ["getrandom"] }

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
indexmap = { version = "2", features = ["serde"] }
lazy-regex = "3"
thiserror = "2"
futures = "0.3"

# Matrix sync is browser-only (`js`, `indexeddb`). Kept out of native builds so
# `cargo build`/`cargo test` don't need a C compiler (matrix-sdk pulls rustls/aws-lc).
[target.'cfg(target_arch = "wasm32")'.dependencies]
matrix-sdk = { version = "0.18", default-features = false, features = ["js", "indexeddb"] }
ruma = "0.16"
url = "2"
