[tools]
mkcert = "latest"
"github:kunobi-ninja/kache" = "latest"
rust = { version = "latest", profile = "default" }

[env]
RUSTC_WRAPPER = "kache"

[tasks.bootstrap]
description = "Install mkcert local CA trust store"
run = "mkcert -install"

[tasks.serve]
description = "Serve a worktree for agent testing (random port, pid file)"
file = "mise-tasks/serve"

[tasks.merge]
description = "Fast-forward merge a feature branch into main, clean up worktree"
run = "scripts/merge.sh {{arg(name='branch', required=true)}} {{arg(name='dry', required=false)}}"
